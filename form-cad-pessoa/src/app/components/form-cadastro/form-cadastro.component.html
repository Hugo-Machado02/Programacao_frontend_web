<div class="form-container">
    <form (ngSubmit)="onSubmit()" class="cadastro-form">
        <h2>Cadastro de Pessoa</h2>
        
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" [(ngModel)]="cadastro.nome" placeholder="Digite seu nome completo" required>
        </div>
        
        <div class="form-group">
            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" [(ngModel)]="cadastro.dataNascimento" required>
        </div>
        
        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" [(ngModel)]="cadastro.telefone" (input)="formatPhone($event)" placeholder="(00) 00000-0000" maxlength="15" required>
        </div>
        
        <div class="form-group">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" [(ngModel)]="cadastro.endereco" placeholder="Digite seu endereço completo" required>
        </div>

        <button type="submit" class="btn-submit">Cadastrar</button>
    </form>
</div>
