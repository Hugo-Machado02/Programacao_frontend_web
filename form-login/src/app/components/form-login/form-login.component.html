<div id="formLogin">
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <h2>Login</h2>
        
        <div class="form-group">
            <label for="txtUser">Usuário</label>
            <input type="text" class="form-control" name="txtUser" id="txtUser" 
                   [(ngModel)]="login.user" placeholder="Digite seu usuário" 
                   required minlength="3" #user="ngModel">
            <div *ngIf="user.invalid && user.touched" class="error-message">
                <small *ngIf="user.errors?.['required']">Usuário é obrigatório</small>
                <small *ngIf="user.errors?.['minlength']">Usuário deve ter pelo menos 3 caracteres</small>
            </div>
        </div>

        <div class="form-group">
            <label for="txtSenha">Senha</label>
            <div class="password-container">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" 
                       name="txtSenha" id="txtSenha" [(ngModel)]="login.password" 
                       placeholder="Digite sua senha" required minlength="6" #password="ngModel">
                <button type="button" class="toggle-password" (click)="togglePassword()">
                    <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
            </div>
            <div *ngIf="password.invalid && password.touched" class="error-message">
                <small *ngIf="password.errors?.['required']">Senha é obrigatória</small>
                <small *ngIf="password.errors?.['minlength']">Senha deve ter pelo menos 6 caracteres</small>
            </div>
        </div>

        <input type="submit" class="btn btn-primary" value="Entrar" [disabled]="loginForm.invalid">
    </form>
</div>
