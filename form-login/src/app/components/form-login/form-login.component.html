<style>
    #formLogin {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    form {
        width: 24rem;
        margin: 0;
        padding: 32px;
        background: #fff;
        border: none;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        font-family: "Segoe UI", Roboto, sans-serif;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #333;
        font-weight: 600;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
        position: relative;
    }

    label {
        font-size: 14px;
        color: #555;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .form-control {
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
        background: #f8f9fa;
    }

    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        background: #fff;
    }

    .password-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-container input {
        padding-right: 40px;
        width: 100%;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        color: #666;
        font-size: 16px;
        padding: 4px;
        z-index: 1;
    }

    .toggle-password:hover {
        color: #667eea;
    }

    .btn {
        width: 100%;
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        border: none;
        transition: all 0.3s ease;
        margin-top: 8px;
    }

    .btn:active {
        transform: translateY(1px);
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
</style>


<div id="formLogin">
    <form (ngSubmit)="onSubmit()">
        <h2>Login</h2>
        
        <div class="form-group">
            <label for="txtUser">Usuário</label>
            <input type="text" class="form-control" name="txtUser" id="txtUser" [(ngModel)]="login.user" placeholder="Digite seu usuário">
        </div>

        <div class="form-group">
            <label for="txtSenha">Senha</label>
            <div class="password-container">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" name="txtSenha" id="txtSenha" [(ngModel)]="login.password" placeholder="Digite sua senha">
                <button type="button" class="toggle-password" (click)="togglePassword()">
                    <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
            </div>
        </div>

        <input type="submit" class="btn btn-primary" value="Entrar">
    </form>
</div>
